[project]
name = "world-cup-autoposter"
version = "0.1.0"
description = "Autonomous football content creation system for Instagram Reels and YouTube Shorts"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # Web Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",

    # Database
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "aiosqlite>=0.19.0",  # SQLite support (development)
    "asyncpg>=0.29.0",  # PostgreSQL support (production - Render)

    # LLM & AI
    "requests>=2.31.0",

    # Scraping (free, open-source)
    "instaloader>=4.11.0",
    "yt-dlp>=2023.12.30",

    # Video Processing (free, open-source)
    "moviepy>=1.0.3",
    "imageio-ffmpeg>=0.4.9",
    "pillow>=10.2.0",  # Image processing for thumbnails
    "numpy>=1.26.3",

    # Audio & TTS (FREE - zero cost)
    "edge-tts>=6.1.15",
    "faster-whisper>=1.0.0",
    "librosa>=0.10.0",  # Optional: For audio peak detection in clips

    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "aiohttp>=3.9.1",
    "httpx>=0.26.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.1.0",
    "python-slugify>=8.0.1",

    # Scheduling
    "apscheduler>=3.10.4",

    # Logging
    "loguru>=0.7.2",

    # WhatsApp Notifications (OpenWA - open source)
    "openwa>=0.0.5",

    # Testing
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
]

[project.optional-dependencies]
dev = [
    "black>=23.12.1",
    "ruff>=0.1.11",
    "mypy>=1.8.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true